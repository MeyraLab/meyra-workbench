<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEYRA OS</title>
    <meta name="meyra-os" content="v11.2" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/meyra-mark.svg" />
    <meta property="og:title" content="MEYRA OS" />
    <meta property="og:image" content="https://meyra-workbench.vercel.app/meyra-mark.svg" />
    <meta name="theme-color" content="#f4efe6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("meyra-theme") || "system";
          var dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themePref = saved;
          if (sessionStorage.getItem("meyra-os-entered") === "1") document.documentElement.dataset.entered = "1";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.dataset.themePref = "system";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
