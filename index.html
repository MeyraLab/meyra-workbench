<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meyra's 工作台</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('meyra-theme') || 'system';
          var dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.themePref = saved;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.themePref = 'system';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
